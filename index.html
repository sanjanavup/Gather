<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather | Good plans start here</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#233d2d;background:#f5f7f1}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:15px;max-width:1050px;margin:auto;padding:28px 22px}header strong{font-size:29px;letter-spacing:-1.5px}.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#254f35;color:white;margin-right:8px}.wrap{max-width:1050px;margin:auto;padding:10px 22px 80px}.hero{background:#e6efde;border-radius:27px;padding:30px 34px;margin:12px 0 25px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(27px,4vw,46px);margin:10px 0;letter-spacing:-1.5px}.muted{color:#67786b}.hero p{line-height:1.5;color:#58695c;margin-bottom:0}.emoji{font-size:70px}.columns{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel{border:1px solid #e3e9df;border-radius:20px;background:white;padding:22px;box-shadow:0 5px 25px #233c2608}.panel h2{margin:0 0 12px;font-size:21px}.section{margin:26px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{background:#254f35;color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:650}.btn:hover{filter:brightness(1.12)}.secondary{background:#e7eee5;color:#24412d}.outline{background:white;color:#254f35;border:1px solid #bed0bc}.small{padding:8px 11px;font-size:13px}.chip{background:#edf4e9;border-radius:50px;padding:7px 12px;font-size:13px;display:inline-block;margin:3px}.tabs{display:flex;gap:6px;border-bottom:1px solid #e5e9e1;margin:24px 0 20px}.tab{border:0;background:transparent;padding:12px 14px;color:#6e786d}.tab.active{color:#1f5030;border-bottom:3px solid #1f5030;font-weight:700}.idea{border:1px solid #e4eae0;border-radius:13px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.idea strong{display:block}.idea small{color:#687669}.notice{background:#f0f5eb;padding:15px;border-radius:12px;color:#45614b;margin:15px 0;font-size:14px;line-height:1.5}.field{width:100%;border:1px solid #d4ded1;border-radius:10px;padding:11px;background:white;color:#263e2d;margin:5px 0 15px}.field:focus{outline:2px solid #aac6a1}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-size:13px;font-weight:650}.card{padding:13px 0;border-bottom:1px solid #edf0eb}.card:last-child{border:0}.card small{display:block;color:#68786d;margin-bottom:4px}.vote{width:100%;background:white;border:1px solid #dae7d6;border-radius:12px;padding:15px;text-align:left;margin:6px 0}.vote.selected{border:2px solid #28633c;background:#f0f8ed}.bar{height:10px;border-radius:8px;background:#e7ede3;overflow:hidden;margin:6px 0 14px}.fill{height:100%;background:#557f56}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#12201988;display:grid;place-items:center;padding:20px;z-index:4}.modal{background:white;width:min(540px,100%);max-height:90vh;overflow:auto;padding:27px;border-radius:20px}#status{position:fixed;bottom:20px;right:20px;background:#244a32;color:white;padding:12px 17px;border-radius:11px;display:none;max-width:330px}.sideitem{width:100%;text-align:left;border:1px solid #dce8d9;background:#f7faf5;padding:12px;border-radius:11px;margin:5px 0}.sideitem.active{border-color:#346447;background:#e7f0e5}aside small{color:#798779}.empty{padding:35px 10px;text-align:center;color:#68806d}.footer{color:#778776;font-size:12px;margin-top:22px}@media(max-width:750px){.wrap{padding:8px 13px 45px}.panel{padding:17px}.hero{margin-top:5px;border-radius:18px}.row.between{align-items:flex-start}.tabs{overflow-x:auto}.tab{white-space:nowrap}.btn{min-height:40px}.idea{gap:10px;overflow-wrap:anywhere}#status{left:12px;right:12px;bottom:12px;max-width:none}.modal{padding:20px}header{gap:10px} .columns{grid-template-columns:1fr}.hero{padding:23px}.emoji{display:none}.two{grid-template-columns:1fr}header{padding:18px}header strong{font-size:24px}}
</style></head><body>
<header><strong><span class="logo">✳</span>gather<span style="color:#90ac92">.</span></strong><button class="btn" id="newTop">+ New outing</button></header><div class="wrap"><div class="hero"><div><div style="font-size:12px;font-weight:800;letter-spacing:1.5px">YOUR GROUP PLANNING SPACE</div><h1>Good plans start here.</h1><p>Pick a day. Throw in ideas. Make a plan together.</p></div><span class="emoji">🍕🌿</span></div><div class="columns"><aside class="panel"><div class="row between"><h2>My outings</h2><button class="btn secondary small" id="newSide">+</button></div><div id="myOutings"></div><p class="footer">Outings you've opened on this browser. Keep your links to access them elsewhere.</p></aside><main class="panel" id="main"></main></div></div><div id="modalHost"></div><div id="status"></div>
<script>
const LS='gather_shared_events_v1',TOKEN='gather_voter_token_v1';const $=id=>document.getElementById(id);const x=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID();let seen=JSON.parse(localStorage.getItem(LS)||'[]'),current=new URLSearchParams(location.search).get('event'),outing=null,tab='overview',myVote=null;let token=localStorage.getItem(TOKEN);if(!token){token=uid()+uid();localStorage.setItem(TOKEN,token)}
function flash(msg){$('status').textContent=msg;$('status').style.display='block';clearTimeout(window.flashTimer);window.flashTimer=setTimeout(()=>$('status').style.display='none',2800)}
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function remember(id,key){const old=seen.find(e=>e.id===id);if(old){if(key)old.key=key}else seen.unshift({id,key:key||null});localStorage.setItem(LS,JSON.stringify(seen))}function adminKey(){return seen.find(e=>e.id===current)?.key||null}function urlFor(id){return location.origin+'/?event='+encodeURIComponent(id)}
async function openOuting(id){current=id;tab='overview';history.replaceState({},'',id?'?event='+encodeURIComponent(id):'/');await refresh();}
async function refresh(){if(!current){outing=null;render();return}try{const a=await api('/outings/'+current);outing=a.outing;remember(current);const b=await api('/outings/'+current+'/my-vote?voter='+encodeURIComponent(token));myVote=b.ideaId;render()}catch(e){outing=null;render();flash(e.message)}}
function money(v){const t=String(v||'').trim();return t && /^\d+(?:\.\d{1,2})?$/.test(t)?'$'+t:t||'Not decided'}function counts(){return {going:outing.guests.filter(g=>g.rsvp==='going').length,maybe:outing.guests.filter(g=>g.rsvp==='maybe').length,no:outing.guests.filter(g=>g.rsvp==='no').length}}function render(){const nav=$('myOutings');nav.innerHTML=seen.length?seen.map(s=>`<button class="sideitem ${s.id===current?'active':''}" data-id="${x(s.id)}">${x(s.id===current&&outing?outing.title:(s.title||'Shared outing'))}</button>`).join(''):'<div class="muted">No outings yet.</div>';nav.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openOuting(b.dataset.id));if(outing){const s=seen.find(a=>a.id===current);if(s){s.title=outing.title;localStorage.setItem(LS,JSON.stringify(seen));const active=nav.querySelector('.active');if(active)active.textContent=outing.title}}const m=$('main');if(!outing){m.innerHTML='<div class="empty"><h2>Make some plans ✨</h2><p>Create an outing and invite your group with a link.</p><button class="btn" id="start">Create outing</button></div>';$('start').onclick=showCreate;return}m.innerHTML=`<div class="row between"><div><span class="chip">✨ Group outing</span><h1 style="margin:8px 0">${x(outing.title)}</h1><p class="muted">📍 ${x(outing.city||'Location TBD')} · ${x(outing.date||'Date TBD')}</p></div><div class="row">${adminKey()?'<button class="btn outline small" id="editOuting">✎ Edit outing</button>':''}<button class="btn secondary" id="share">↗ Share link</button></div></div><div class="row" style="margin-top:8px"><span class="chip">👥 ${counts().going} going · ${counts().maybe} maybe</span><span class="chip">📍 ${outing.options.length} ideas</span><span class="chip">🗳️ ${outing.voteCount} votes</span></div><div class="tabs">${['overview','places','vote'].map(t=>`<button data-tab="${t}" class="tab ${tab===t?'active':''}">${t==='overview'?'Overview':t==='places'?'Places':'Vote'}</button>`).join('')}</div><div id="content"></div>`;$('share').onclick=share;if(adminKey())$('editOuting').onclick=showEdit;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});renderContent()}
function renderContent(){const c=$('content');if(tab==='overview'){c.innerHTML=`<div class="two"><div class="card"><small>When</small><strong>${x(outing.date||'Date TBD')} ${x(outing.time||'')}</strong></div><div class="card"><small>Budget per person</small><strong>${x(money(outing.budget))}</strong></div><div class="card"><small>Area</small><strong>${x(outing.city||'Not decided')}</strong></div><div class="card"><small>The vibe</small><strong>${x(outing.description||'Whatever sounds fun!')}</strong></div></div><div class="section"><div class="row between"><h2>Who's coming?</h2><button class="btn small secondary" id="join">+ Add your name</button></div>${outing.guests.length?outing.guests.map(g=>`<span class="chip">${g.rsvp==='going'?'✅':g.rsvp==='maybe'?'🤔':'❌'} ${x(g.name)} · ${g.rsvp==='no'?'Can’t make it':g.rsvp==='maybe'?'Maybe':'Going'}</span>`).join(''):'<p class="muted">Invite friends or add your name.</p>'}</div><div class="section"><h2>What next?</h2><div class="row"><button class="btn" id="ideaQuick">+ Suggest a place</button><button class="btn outline" id="voteQuick">Group vote</button><button class="btn secondary" id="shareQuick">Share outing</button></div></div><div class="notice">Everyone with the link can view this outing, add suggestions, and vote. Only the organizer can open or close voting and reveal results.</div>`;$('join').onclick=showRSVP;$('ideaQuick').onclick=()=>{tab='places';render();ideaForm()};$('voteQuick').onclick=()=>{tab='vote';render()};$('shareQuick').onclick=share}
else if(tab==='places'){c.innerHTML=`<div class="row between"><div><h2>Place ideas</h2><p class="muted">Restaurants, activities, or whatever the group is considering.</p></div><button class="btn" id="addIdea">+ Suggest a place</button></div>${outing.options.length?outing.options.map(i=>`<div class="idea"><div><strong>${x(i.name)}</strong><small>${x(i.note||'')}</small></div><span>📍</span></div>`).join(''):'<div class="empty">No suggestions yet. Add the first one!</div>'}`;$('addIdea').onclick=ideaForm}
else{const tallies=outing.tallies||{};const max=Math.max(0,...Object.values(tallies));c.innerHTML=`<div class="row between"><div><h2>Anonymous destination vote</h2><p class="muted">Pick your favorite. Your choice isn't shown to the group.</p></div><span class="chip">${outing.votingOpen?'🟢 Open':'🔒 Closed'}</span></div>${outing.options.length<2?'<div class="notice">Add at least two places before voting.</div>':outing.options.map(o=>`<button class="vote ${myVote===o.id?'selected':''}" data-vote="${x(o.id)}" ${!outing.votingOpen?'disabled':''}>${x(o.name)} ${myVote===o.id?'✓':''}</button>`).join('')}<p class="muted" style="font-size:13px">${myVote?'Your choice is saved. You can change it while voting is open.':'One vote per browser profile; no name is attached.'}</p>${outing.resultsVisible?`<div class="section"><h2>Group results · ${outing.voteCount} votes</h2>${outing.options.map(o=>`<div><div class="row between"><strong>${x(o.name)}${max>0&&tallies[o.id]===max?' 🏆':''}</strong><span>${tallies[o.id]||0}</span></div><div class="bar"><div class="fill" style="width:${outing.voteCount?Math.round(100*(tallies[o.id]||0)/outing.voteCount):0}%"></div></div></div>`).join('')}</div>`:'<div class="notice">Totals are hidden until the organizer reveals the results.</div>'}${adminKey()?`<div class="section"><h3>Organizer controls</h3><div class="row"><button class="btn secondary" id="toggleOpen">${outing.votingOpen?'Close voting':'Reopen voting'}</button><button class="btn secondary" id="toggleResults">${outing.resultsVisible?'Hide results':'Reveal results'}</button></div></div>`:''}<div class="notice">Privacy note: voting is anonymous to other participants, not cryptographically anonymous. The app counts one vote per browser token; someone using multiple browsers could vote more than once.</div>`;c.querySelectorAll('[data-vote]').forEach(b=>b.onclick=async()=>{try{await api('/outings/'+current+'/vote',{voter:token,ideaId:b.dataset.vote});await refresh();tab='vote';render();flash('Vote saved')}catch(e){flash(e.message)}});if(adminKey()){const set=async d=>{try{await api('/outings/'+current+'/settings',{...d,adminKey:adminKey()});await refresh();tab='vote';render()}catch(e){flash(e.message)}};$('toggleOpen').onclick=()=>set({votingOpen:!outing.votingOpen});$('toggleResults').onclick=()=>set({resultsVisible:!outing.resultsVisible})}}}
function close(){$('modalHost').innerHTML=''}
function formModal(title,fields,submit,initial={}){
$('modalHost').innerHTML=`<div class="modal-bg"><div class="modal"><div class="row between"><h2>${x(title)}</h2><button class="btn secondary small" id="closeModal">✕</button></div><form id="dialogForm">${fields.map(f=>`<label>${x(f[1])}${f[2]==='select'?`<select class="field" name="${f[0]}"><option value="going">Going</option><option value="maybe">Maybe</option><option value="no">Can't make it</option></select>`:`<input class="field" name="${f[0]}" type="${f[2]}" value="${x(initial[f[0]]||'')}" ${f[0]==='title'||f[0]==='name'?'required':''} placeholder="${x(f[3]||'')}" maxlength="${f[0]==='description'?700:120}">`}</label>`).join('')}<div class="row"><button class="btn">Save</button><button type="button" class="btn outline" id="cancelModal">Cancel</button></div></form></div></div>`;
$('closeModal').onclick=$('cancelModal').onclick=close;
$('dialogForm').onsubmit=async e=>{e.preventDefault();try{await submit(Object.fromEntries(new FormData(e.target)));close();await refresh();flash('Saved!')}catch(err){flash(err.message)}};
}
function showCreate(){formModal('Create an outing',[['title','Outing name','text','Saturday night plans'],['date','Date','date',''],['time','Time','time',''],['city','City / area','text','San Jose, CA'],['budget','Budget per person','text','$20–40'],['description','What’s the vibe?','text','Casual dinner, maybe games afterward']],async d=>{const a=await api('/outings',d);remember(a.outing.id,a.adminKey);current=a.outing.id;history.replaceState({},'',urlFor(current));tab='overview'})}
function showRSVP(){formModal('RSVP to this outing',[['name','Your name','text','e.g. Jamie'],['rsvp','Your RSVP','select','going']],d=>api('/outings/'+current+'/guests',d))}
function showEdit(){if(!adminKey())return;formModal('Edit outing',[['title','Outing name','text',''],['date','Date','date',''],['time','Time','time',''],['city','City / area','text',''],['budget','Budget per person','text','e.g. $20–40'],['description','What’s the vibe?','text','']],d=>api('/outings/'+current+'/edit',{...d,adminKey:adminKey()}),outing)}
function ideaForm(){formModal('Suggest a place',[['name','Place or activity','text','Sushi downtown'],['note','Details (optional)','text','Around $25 per person']],d=>api('/outings/'+current+'/ideas',d))}
async function share(){const link=urlFor(current);try{await navigator.clipboard.writeText(link);flash('Share link copied!')}catch{prompt('Copy this outing link',link)}}
$('newTop').onclick=$('newSide').onclick=showCreate;render();refresh();setInterval(()=>{if(current&&document.visibilityState==='visible')refresh()},12000);
</script></body></html>
